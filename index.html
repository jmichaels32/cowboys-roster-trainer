<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#f6f7fb" />
    <meta
      name="description"
      content="A mobile-friendly flashcard trainer for learning football players."
    />
    <title>Player Decks</title>
    <link rel="icon" href="favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="styles.css?v=26" />
    <script src="data/roster.js?v=23" defer></script>
    <script src="data/college-marks.js?v=23" defer></script>
    <script src="data/cowboys-trivia.js?v=26" defer></script>
    <script src="app.js?v=26" defer></script>
  </head>
  <body>
    <a class="skip-link" href="#main-content">Skip to content</a>

    <header class="site-header">
      <button class="header-back" id="header-back" type="button" data-action="home" aria-label="Back to decks" hidden><span aria-hidden="true">←</span></button>
      <strong class="header-context" id="header-context">Decks</strong>
      <button class="header-link" id="browse-players" type="button" data-action="browse" hidden>Roster</button>
    </header>

    <main id="main-content">
      <section class="view dashboard-view is-active" data-view="dashboard" aria-labelledby="home-title">
        <div class="player-decks-shell">
          <h1 class="visually-hidden" id="home-title">Player decks</h1>
          <div class="player-deck-list" id="player-deck-list" aria-label="Choose a player deck"></div>
        </div>
      </section>

      <section class="view setup-view" data-view="setup" aria-labelledby="setup-title" hidden>
        <div class="setup-shell">
          <div class="study-type-switch" aria-label="Study type">
            <button type="button" data-study-type="players" aria-pressed="true">Players</button>
            <button type="button" data-study-type="lineup" aria-pressed="false">Lineup</button>
            <button type="button" data-study-type="trivia" aria-pressed="false">Trivia</button>
          </div>
          <button class="package-selector" id="setup-package" type="button" data-setup-control="package" aria-label="Most famous package. Change package">
            <span id="setup-title">Most famous</span><span aria-hidden="true">⌄</span>
          </button>
          <div class="session-sentence-card">
            <p>
              Practice
              <button class="session-token" id="setup-stage-value" type="button" data-setup-control="stage">recognition</button>
              <span id="setup-content-choice">with
                <button class="session-token" id="setup-mode-value" type="button" data-setup-control="mode">mixed facts</button>
              </span>
              for
              <button class="session-token" id="setup-length-value" type="button" data-setup-control="length">5 cards</button><span id="setup-period">.</span>
            </p>
          </div>
          <button class="button button-primary button-full" id="setup-start" type="button" data-action="start-session">Start 5 cards</button>
        </div>
      </section>

      <section class="view training-view" data-view="training" aria-labelledby="question-title" hidden>
        <div class="game-shell">
          <div class="game-header">
            <button class="icon-button" type="button" data-action="exit-session" aria-label="Exit session">×</button>
            <div class="game-status">
              <div>
                <span id="game-deck-name">Most famous</span>
                <strong id="game-progress-text">1 of 10</strong>
              </div>
              <div
                class="game-progress"
                role="progressbar"
                aria-label="Session progress"
                aria-valuemin="0"
                aria-valuemax="10"
                aria-valuenow="1"
              >
                <span id="game-progress-bar"></span>
              </div>
            </div>
            <div class="score-badge" aria-label="Correct answers"><strong id="game-score">0</strong><span>right</span></div>
          </div>

          <article class="question-card">
            <div class="question-copy">
              <p class="eyebrow" id="question-type">Face check</p>
              <h1 id="question-title">Who is this player?</h1>
            </div>

            <div class="question-visual" id="question-visual"></div>
            <div class="answer-grid" id="answer-grid" aria-label="Typed answer"></div>

            <div class="answer-feedback" id="answer-feedback" aria-live="polite" hidden></div>
          </article>

          <div class="next-wrap" id="next-wrap" hidden>
            <button class="button button-primary button-full" type="button" data-action="next-question">
              Next card <span aria-hidden="true">→</span>
            </button>
          </div>
        </div>
      </section>

      <section class="view results-view" data-view="results" aria-labelledby="results-title" hidden>
        <div class="narrow-shell results-shell">
          <div class="result-mark" id="result-mark" aria-hidden="true">✓</div>
          <p class="eyebrow">Session complete</p>
          <h1 id="results-title">Nice work.</h1>
          <p class="result-score" id="result-score"></p>
          <p class="result-note" id="result-note"></p>

          <div class="result-actions">
            <button class="button button-primary" id="next-stage-button" type="button" data-action="next-stage" hidden></button>
            <button class="button button-primary" type="button" data-action="repeat-session">Practice again</button>
            <button class="button button-quiet" id="result-share-button" type="button" data-action="share-summary">Share today’s summary</button>
            <button class="button button-quiet" type="button" data-action="home">Decks</button>
          </div>

          <section class="missed-section" id="missed-section" hidden>
            <h2>Review these players</h2>
            <div class="missed-list" id="missed-list"></div>
          </section>
        </div>
      </section>

      <section class="view roster-view" data-view="roster" aria-labelledby="roster-title" hidden>
        <div class="wide-shell">
          <div class="roster-nav">
            <h1 id="roster-title">Players</h1>
          </div>

          <div class="search-box">
            <label class="visually-hidden" for="roster-search">Search players</label>
            <span aria-hidden="true">⌕</span>
            <input id="roster-search" type="search" placeholder="Search players" autocomplete="off" />
            <button class="search-clear" id="roster-search-clear" type="button" data-action="clear-roster-search" aria-label="Clear search" hidden>×</button>
          </div>

          <div class="roster-results-heading">
            <p class="roster-count" id="roster-count" aria-live="polite"></p>
            <button class="refine-button" id="roster-controls-button" type="button" data-action="open-roster-controls">
              Refine<span id="roster-filter-count" hidden></span>
            </button>
          </div>
          <div class="player-grid" id="player-grid"></div>
        </div>
      </section>
    </main>

    <dialog class="roster-controls-dialog" id="roster-controls-dialog" aria-labelledby="roster-controls-title">
      <form class="roster-controls-sheet" id="roster-controls-form" novalidate>
        <div class="dialog-heading">
          <h2 id="roster-controls-title">Refine</h2>
          <button class="dialog-close" type="button" data-action="close-roster-controls" aria-label="Close">×</button>
        </div>
        <fieldset class="roster-control-group">
          <legend>Group</legend>
          <div class="roster-choice-grid">
            <label class="roster-choice"><input type="radio" name="group" value="all" checked /><span>Full roster</span></label>
            <label class="roster-choice"><input type="radio" name="group" value="famous" /><span>Most famous</span></label>
            <label class="roster-choice"><input type="radio" name="group" value="starters" /><span>Starters</span></label>
            <label class="roster-choice"><input type="radio" name="group" value="second-string" /><span>2nd string</span></label>
            <label class="roster-choice"><input type="radio" name="group" value="third-string" /><span>3rd string</span></label>
            <label class="roster-choice"><input type="radio" name="group" value="offense" /><span>Offense</span></label>
            <label class="roster-choice"><input type="radio" name="group" value="defense" /><span>Defense</span></label>
            <label class="roster-choice"><input type="radio" name="group" value="practice-squad" /><span>Practice squad</span></label>
          </div>
        </fieldset>
        <fieldset class="roster-control-group">
          <legend>Position</legend>
          <div class="roster-choice-grid" id="position-filter-options">
            <label class="roster-choice"><input type="radio" name="position" value="all" checked /><span>All</span></label>
          </div>
        </fieldset>
        <fieldset class="roster-control-group">
          <legend>Sort</legend>
          <div class="roster-choice-grid">
            <label class="roster-choice"><input type="radio" name="sort" value="name" checked /><span>Name A–Z</span></label>
            <label class="roster-choice"><input type="radio" name="sort" value="number" /><span>Jersey number</span></label>
            <label class="roster-choice"><input type="radio" name="sort" value="position" /><span>Position</span></label>
            <label class="roster-choice"><input type="radio" name="sort" value="college" /><span>College A–Z</span></label>
            <label class="roster-choice"><input type="radio" name="sort" value="height" /><span>Tallest first</span></label>
            <label class="roster-choice"><input type="radio" name="sort" value="weight" /><span>Heaviest first</span></label>
            <label class="roster-choice"><input type="radio" name="sort" value="depth" /><span>Depth chart</span></label>
          </div>
        </fieldset>
        <div class="dialog-actions">
          <button class="button button-quiet" type="button" data-action="clear-roster-controls">Clear</button>
          <button class="button button-primary" type="submit">Apply</button>
        </div>
      </form>
    </dialog>

    <dialog class="session-option-dialog" id="session-option-dialog" aria-labelledby="session-option-title">
      <div class="session-option-sheet">
        <div class="dialog-heading">
          <h2 id="session-option-title">Level</h2>
          <button class="dialog-close" type="button" data-action="close-session-options" aria-label="Close">×</button>
        </div>
        <div class="session-option-list" id="session-option-list"></div>
      </div>
    </dialog>

    <footer class="site-footer">
      <p>
        Unofficial. Cowboys data from the
        <a href="https://www.dallascowboys.com/team/players-roster/" target="_blank" rel="noreferrer">official roster</a>
        · <span id="data-date">July 31, 2026</span>.
      </p>
    </footer>
  </body>
</html>
